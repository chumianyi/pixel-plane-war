name: Build SWF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Build SWF
        run: |
          haxe build.hxml

      - name: Verify SWF
        run: |
          ls -la PixelPlaneWar.swf
          file PixelPlaneWar.swf || true
          echo "SWF built successfully"

      - name: Upload SWF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlaneWar-swf
          path: PixelPlaneWar.swf
          retention-days: 30
