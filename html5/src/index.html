<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素飞机大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:"SimSun","宋体",monospace;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#gameContainer{position:relative;width:480px;height:800px;max-width:100vw;max-height:100vh}
#gameCanvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;background:#0A1628}
</style>
</head>
<body>
<div id="gameContainer"><canvas id="gameCanvas" width="480" height="800"></canvas></div>
<script>
const COLORS={'.':null,'K':'#000000','W':'#FFFFFF','R':'#E53935','G':'#43A047','B':'#1E88E5','Y':'#FDD835','O':'#FB8C00','P':'#EC407A','U':'#8E24AA','S':'#BDBDBD','D':'#424242','L':'#90CAF9','H':'#FFCCBC','N':'#6D4C41','C':'#00ACC1','M':'#5D4037','E':'#EEEEEE','F':'#795548','T':'#00E5FF','V':'#7C4DFF','Q':'#FF6F00','Z':'#263238'};
function drawPixelArt(ctx,rows,x,y,scale){for(let r=0;r<rows.length;r++){for(let c=0;c<rows[r].length;c++){const col=COLORS[rows[r][c]];if(col){ctx.fillStyle=col;ctx.fillRect(x+c*scale,y+r*scale,scale,scale)}}}}
function getArtSize(rows,scale){return{w:rows[0].length*scale,h:rows.length*scale}}
function rand(min,max){return Math.random()*(max-min)+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function drawText(ctx,text,x,y,size,color,bold){ctx.save();ctx.font=(bold?'bold ':'')+size+'px "SimSun","宋体",monospace';ctx.fillStyle=color;ctx.textBaseline='top';ctx.fillText(text,x,y);ctx.restore()}
function measureText(ctx,text,size,bold){ctx.save();ctx.font=(bold?'bold ':'')+size+'px "SimSun","宋体",monospace';const w=ctx.measureText(text).width;ctx.restore();return w}
const ART_PLAYER_CHAR=["....GGGGGGGG....","...GHHHHHHHHG...","..GHWKHHHHKWGH..","..GHHHHHHHHHHG..","..GHHKHHHHKHHG..","..GHWWHWWHWWHG..","...GHHHHHHHHG...","....GGGGGGGG....","...RRRRRRRRRR...","..RRWWRRRRWWRR..","..RRWWRRRRWWRR..","...RRRRRRRRRR...","....DD....DD....","....DD....DD....","...DDD....DDD...","...KKK....KKK..."];
const ART_NPC_CHAR=["....BBBBBBBB....","...BHHHHHHHHB...","..BHWKHHHHKWBH..","..BHHHHHHHHHHB..","..BHHKHHHHKHHB..","..BHWWHWWHWWHB..","...BHHHHHHHHB...","....BBBBBBBB....","...OOOOOOOOOO...","..OOWWOOOOWWOO..","..OOWWOOOOWWOO..","...OOOOOOOOOO...","....DD....DD....","....DD....DD....","...DDD....DDD...","...KKK....KKK..."];
const ART_CHIEF_CHAR=["....YYYYYYYY....","...YYYYYYYYYY...","..YYKKKKKKKKYY..","...HHHHHHHHHH...","..HWKHHHHHHKWH..","..HHHHHHHHHHHH..","..HHHKHHHHKHHH..","..HHWWHWWHWWHH..","...HHHHHHHHHH...","....NNNNNNNN....","...NNNNNNNNNN...","..NNWNNNNNNWNN..","....DD....DD....","....DD....DD....","...DDD....DDD...","...KKK....KKK..."];
const ART_PLAYER_PLANE=[".......TTTT.......","......TCCCC T......","......TCCCC T......",".....TCCWWCCT.....",".....TCCWWCCT.....","....TCCWWWWCCT....","....TCCWWWWCCT....","...SSSCCCCCCSSS...","..SSSSSCCCCSSSSS..",".SSSSSSSCCSSSSSSS.","SSSSSSSSSSSSSSSSSS","SSSKKSSSSSSSSKKSSS","SSKKKSSSSSSSSKKKSS","SKKKSSSSSSSSSSKKKS","SKKSSSSSSSSSSSSKKS","SKSSSSSSSSSSSSSSKS","SSSSSSSSSSSSSSSSSS",".SSSSSSSSSSSSSSSS.","..SSSSSSSSSSSSSS..","...SSSSSSSSSSSS...","....SSSSSSSSSS....",".....SSSSSSSS.....","......SSSSSS......",".......OOOO.......",".......OYYO.......","........OO........","........QQ........",".......QRRQ.......","......QRRRRQ......",".......QRRQ......."];
const ART_ENEMY_NORMAL=["......DDDDDD......",".....DDDDDDDD.....","....DDDRRRRDDD....","....DDRRRRRRDD....","...DDRRWWWWRRDD...","...DDRRWWWWRRDD...","..DDDDRRRRRRDDDD..",".DDDDDDDDDDDDDDDD.","DDDDKKDDDDDDKKDDDD","DDDKKKDDDDDDKKKDDD","DDKKKDDDDDDDDKKKDD","DDKKDDDDDDDDDDKKDD","DDKDDDDDDDDDDDDKDD","DDDDDDDDDDDDDDDDDD",".DDDDDDDDDDDDDDDD.","..DDDDDDDDDDDDDD..","...DDDDDDDDDDDD...","....DDDDDDDDDD....",".....DDDDDDDD.....","......DDDDDD......",".......OOOO.......",".......OYYO.......","........OO........"];
const ART_ENEMY_ELITE=["........UUUUUU........",".......UUUUUUUU.......","......UUVVVVVVUU......",".....UUVVVVVVVVUU.....","....UUVVWWWWWWVVUU....","....UUVVWWWWWWVVUU....","...UUVVVWWWWWWVVVUU...","..UUUUVVVVVVVVVVUUUU..",".UUUUUUVVVVVVVVUUUUUU.","UUUUUUUUVVVVVVUUUUUUUU","UUUKKUUUUVVVVUUUUKKUUU","UUKKKUUUUVVVVUUUKKKUU","UKKKUUUUUVVVVUUUUKKKU","UKKUUUUUUUVVVUUUUUKKU","UKUUUUUUUUUVVUUUUUKU","UUUUUUUUUUUVVUUUUUUU",".UUUUUUUUUUVVUUUUUU.","..UUUUUUUUUVVUUUUU..","...UUUUUUUUUVUUUU...","....UUUUUUUUUUUU....",".....UUUUUUUUUU.....","......UUUUUUUU......",".......OOOOOOOO.......",".......OYYYYYYO.......","........OYYYYO........",".........OOOO.........",".........QRRQ.........","........QRRRRQ........"];
const ART_BULLET_PLAYER=[".YY.","YWWY","YWWY","YCCY","YCCY","YTTY","YTTY",".TT."];
const ART_BULLET_ENEMY=[".RR.","RQQR","RQQR","ROOR","ROOR","RYYR","RYYR",".YY."];
const ART_EXPLOSION_1=["...OOO...","..OYYYO..",".OYWWWYO.","OYWWWWWWO","OYWWWWWYO",".OYWWWYO.","..OYYYO..","...OOO..."];
const ART_EXPLOSION_2=["..O...O..",".OYY.YYO.","OYWWWWWYO","OYWWWWWYO","..WWWWW..","OYWWWWWYO",".OYY.YYO.","..O...O.."];
const ART_EXPLOSION_3=[".O.....O.","OQ.....QO","..Q...Q..","...QQQ...","...QQQ...","..Q...Q..","OQ.....QO",".O.....O."];
const ART_SMOKE=["..DDD..",".DSSSD.","DSEESS D","DSEESS D",".DSSSD.","..DDD.."];
const ART_STAR=[".W.","WWW",".W."];
const ART_CLOUD=["..EEEE..",".EEEEEE.","EEEEEEEE","EEEEEEEE",".EEEEEE."];
function genBossArt(){const rows=[];for(let y=0;y<48;y++){let row="";for(let x=0;x<64;x++){let ch=".";if(y<4){if(x>=24&&x<40)ch="V";else if(x>=20&&x<44&&y>=2)ch="U"}else if(y<12){if(x>=16&&x<48){if(x>=28&&x<36&&y>=6)ch="R";else if(x>=30&&x<34&&y>=8)ch="Y";else ch="U"}else if(x>=12&&x<52)ch="V"}else if(y<24){if(x>=4&&x<60){if((x<12||x>=52)&&y>=16)ch="K";else if(x>=20&&x<44&&y>=14&&y<20)ch="V";else if(x>=24&&x<40&&y>=16&&y<18)ch="R";else ch="U"}}else if(y<36){if(x>=8&&x<56){if((x>=16&&x<24)||(x>=40&&x<48))ch=y>=28?"K":"D";else ch="U"}}else{if(x>=20&&x<44){ch=y>=40?(x>=26&&x<38?"Q":"O"):"D"}else if(x>=24&&x<40&&y>=38)ch="Y"}row+=ch}rows.push(row)}return rows}
const ART_ENEMY_BOSS=genBossArt();
class Bullet{constructor(isPlayer,x,y){this.isPlayer=isPlayer;this.px=x;this.py=y;this.alive=true;this.damage=1;this.vx=0;this.vy=isPlayer?-12:6;const art=isPlayer?ART_BULLET_PLAYER:ART_BULLET_ENEMY;this.scale=2;const sz=getArtSize(art,this.scale);this.w=sz.w;this.h=sz.h;this.art=art}update(){this.px+=this.vx;this.py+=this.vy;if(this.py<-20||this.py>820||this.px<-20||this.px>500)this.alive=false}draw(ctx){drawPixelArt(ctx,this.art,this.px-this.w/2,this.py-this.h/2,this.scale)}hitTest(ox,oy,ow,oh){return this.px>ox-ow/2&&this.px<ox+ow/2&&this.py>oy-oh/2&&this.py<oy+oh/2}}
class Explosion{constructor(x,y,scale){this.px=x;this.py=y;this.frame=0;this.frameTimer=0;this.alive=true;this.scale=scale||3;this.arts=[ART_EXPLOSION_1,ART_EXPLOSION_2,ART_EXPLOSION_3,ART_EXPLOSION_1]}update(){this.frameTimer++;if(this.frameTimer>=4){this.frameTimer=0;this.frame++;if(this.frame>3)this.alive=false}}draw(ctx){if(!this.alive)return;const art=this.arts[this.frame];const sz=getArtSize(art,this.scale);drawPixelArt(ctx,art,this.px-sz.w/2,this.py-sz.h/2,this.scale)}}
class Player{constructor(x,y){this.px=x;this.py=y;this.speed=6;this.hp=5;this.maxHp=5;this.alive=true;this.shootCooldown=0;this.invincible=0;this.crashing=false;this.crashVy=1;this.smokeTimer=0;this.scale=2;const sz=getArtSize(ART_PLAYER_PLANE,this.scale);this.w=sz.w;this.h=sz.h;this.visible=true}update(keys,touchX,touchY,touching,sw,sh){if(this.crashing){this.crashVy+=0.15;this.py+=this.crashVy;this.px+=Math.sin(this.py*0.05)*2;this.smokeTimer++;if(this.py>sh+50)this.alive=false;return}if(!this.alive)return;if(touching){const dx=touchX-this.px;const dy=touchY-this.py-40;const dist=Math.sqrt(dx*dx+dy*dy);if(dist>2){this.px+=dx*0.15;this.py+=dy*0.15}}else{if(keys.left)this.px-=this.speed;if(keys.right)this.px+=this.speed;if(keys.up)this.py-=this.speed;if(keys.down)this.py+=this.speed}this.px=clamp(this.px,this.w/2,sw-this.w/2);this.py=clamp(this.py,this.h/2,sh-this.h/2);if(this.shootCooldown>0)this.shootCooldown--;if(this.invincible>0){this.invincible--;this.visible=(this.invincible%4<2)}else{this.visible=true}}canShoot(){return this.shootCooldown<=0&&this.alive&&!this.crashing}shoot(){this.shootCooldown=10;return new Bullet(true,this.px,this.py-this.h/2)}takeDamage(dmg){if(this.invincible>0||this.crashing)return false;this.hp-=dmg;this.invincible=60;if(this.hp<=0){this.hp=0;this.crashing=true;this.crashVy=1}return true}draw(ctx){if(!this.visible)return;drawPixelArt(ctx,ART_PLAYER_PLANE,this.px-this.w/2,this.py-this.h/2,this.scale)}}
class Enemy{constructor(type,x,y){this.type=type;this.px=x;this.py=y;this.alive=true;this.entered=false;this.moveTimer=0;this.shootCooldown=60;let art,scale;if(type==="normal"){art=ART_ENEMY_NORMAL;this.hp=2;this.vy=2;this.scoreValue=100;scale=2}else if(type==="elite"){art=ART_ENEMY_ELITE;this.hp=5;this.vy=1.5;this.scoreValue=300;scale=2}else{art=ART_ENEMY_BOSS;this.hp=50;this.vy=1;this.scoreValue=2000;scale=1}this.maxHp=this.hp;this.scale=scale;const sz=getArtSize(art,scale);this.w=sz.w;this.h=sz.h;this.art=art;this.targetY=type==="boss"?100:100+Math.random()*150}update(sw,sh){if(!this.alive)return;this.moveTimer++;if(!this.entered){this.py+=this.vy;if(this.py>=this.targetY)this.entered=true}else{if(this.type==="normal"){this.px+=Math.sin(this.moveTimer*0.03)*1.5;this.py+=0.5}else if(this.type==="elite"){this.px+=Math.sin(this.moveTimer*0.02)*2;this.py+=Math.sin(this.moveTimer*0.01)*0.5}else{this.px+=Math.sin(this.moveTimer*0.015)*1.5;this.py=this.targetY+Math.sin(this.moveTimer*0.01)*20}}this.px=clamp(this.px,this.w/2,sw-this.w/2);if(this.shootCooldown>0)this.shootCooldown--;if(this.py>sh+50)this.alive=false}canShoot(){return this.shootCooldown<=0&&this.alive&&this.entered}shoot(){const bullets=[];if(this.type==="normal"){this.shootCooldown=90;bullets.push(new Bullet(false,this.px,this.py+this.h/2))}else if(this.type==="elite"){this.shootCooldown=70;bullets.push(new Bullet(false,this.px-10,this.py+this.h/2));bullets.push(new Bullet(false,this.px+10,this.py+this.h/2))}else{this.shootCooldown=40;const angles=[-0.2,0,0.2];for(const a of angles){const b=new Bullet(false,this.px,this.py+this.h/2);b.vx=Math.sin(a)*4;b.vy=Math.cos(a)*5;bullets.push(b)}if(this.moveTimer%200<40){for(let i=0;i<5;i++){const angle=-0.4+i*0.2;const b=new Bullet(false,this.px,this.py+this.h/2);b.vx=Math.sin(angle)*3;b.vy=Math.cos(angle)*4;bullets.push(b)}}}return bullets}takeDamage(dmg){this.hp-=dmg;if(this.hp<=0){this.hp=0;this.alive=false;return true}return false}draw(ctx){drawPixelArt(ctx,this.art,this.px-this.w/2,this.py-this.h/2,this.scale)}}
class Character{constructor(type,x,y,scale){this.type=type;this.px=x;this.py=y;this.walkTimer=0;this.facing=1;this.scale=scale||3;let art;if(type==="player")art=ART_PLAYER_CHAR;else if(type==="npc")art=ART_NPC_CHAR;else art=ART_CHIEF_CHAR;const sz=getArtSize(art,this.scale);this.w=sz.w;this.h=sz.h;this.art=art}update(){this.walkTimer++;if(this.walkTimer>30)this.walkTimer=0}walkTo(targetX,speed){const dx=targetX-this.px;if(Math.abs(dx)<speed){this.px=targetX;return true}this.px+=(dx>0?speed:-speed);this.facing=dx>0?1:-1;this.walkTimer++;return false}draw(ctx){const bob=Math.sin(this.walkTimer*0.2)*1;drawPixelArt(ctx,this.art,this.px-this.w/2,this.py-this.h/2+bob,this.scale)}}
class IntroScene{constructor(game){this.game=game;this.complete=false;this.state=0;this.stateTimer=0;this.textIndex=0;this.textTimer=0;this.fullText="我们的飞机即将要失守了。上面派了我们去围攻那些战机。我们走吧。";this.groundY=game.h-120;this.npc=new Character("npc",120,this.groundY,3);this.player=new Character("player",220,this.groundY,3);this.planeScale=2;const psz=getArtSize(ART_PLAYER_PLANE,this.planeScale);this.planeX=340-psz.w/2;this.planeY=this.groundY-psz.h+20;this.stars=[];for(let i=0;i<30;i++)this.stars.push({x:Math.random()*game.w,y:Math.random()*(this.groundY-50)})}
handleClick(){if(this.state===0){if(this.textIndex<this.fullText.length)this.textIndex=this.fullText.length;else{this.state=1;this.stateTimer=0}}}
update(){const g=this.game;if(this.state===0){this.textTimer++;if(this.textTimer>=2&&this.textIndex<this.fullText.length){this.textTimer=0;this.textIndex++}this.npc.update();this.player.update()}else if(this.state===1){this.stateTimer++;const nd=this.npc.walkTo(300,3);const pd=this.player.walkTo(330,3);if(nd&&pd){this.state=2;this.stateTimer=0}}else if(this.state===2){this.stateTimer++;if(this.stateTimer>30){this.state=3;this.stateTimer=0}}else if(this.state===3){this.stateTimer++;this.planeY-=3+this.stateTimer*0.1;this.planeX+=Math.sin(this.stateTimer*0.1)*1;if(this.planeY<-100||this.stateTimer>100)this.complete=true}}
draw(ctx){const g=this.game;ctx.fillStyle="#0D1B2A";ctx.fillRect(0,0,g.w,g.h);for(const s of this.stars){if(Math.random()>0.1)drawPixelArt(ctx,ART_STAR,s.x,s.y,1)}ctx.fillStyle="#1B3A2F";ctx.fillRect(0,this.groundY,g.w,g.h-this.groundY);ctx.fillStyle="#2D5A47";for(let i=0;i<20;i++)ctx.fillRect(i*30,this.groundY,15,4);
drawPixelArt(ctx,ART_PLAYER_PLANE,this.planeX,this.planeY,this.planeScale);
if(this.state<2){this.npc.draw(ctx);this.player.draw(ctx)}
if(this.state===0){ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(30,g.h-180,g.w-60,130);ctx.strokeStyle="#4FC3F7";ctx.lineWidth=2;ctx.strokeRect(30,g.h-180,g.w-60,130);drawText(ctx,"NPC队员",50,g.h-175,14,"#FFEB3B",true);const text=this.fullText.substring(0,this.textIndex);ctx.save();ctx.font='14px "SimSun","宋体",monospace';ctx.fillStyle="#FFFFFF";ctx.textBaseline="top";const maxW=g.w-100;let line="";let ly=g.h-150;for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxW){ctx.fillText(line,50,ly);line=ch;ly+=22}else line=test}ctx.fillText(line,50,ly);ctx.restore();if(this.textIndex>=this.fullText.length&&Math.floor(Date.now()/500)%2===0)drawText(ctx,"点击继续",g.w-100,g.h-70,12,"#AAAAAA")}}}
class BattleScene{constructor(game){this.game=game;this.complete=false;this.player=new Player(game.w/2,game.h-150);this.enemies=[];this.playerBullets=[];this.enemyBullets=[];this.explosions=[];this.smokes=[];this.score=0;this.wave=1;this.waveTimer=0;this.enemiesSpawned=0;this.enemiesInWave=5;this.bossSpawned=false;this.bossDefeated=false;this.autoShootTimer=0;this.crashExplosionDone=false;this.gameOverTimer=0;this.victory=false;this.finalScore=0;this.stars=[];for(let i=0;i<50;i++)this.stars.push({x:Math.random()*game.w,y:Math.random()*game.h});this.clouds=[];for(let i=0;i<5;i++)this.clouds.push({x:Math.random()*game.w,y:Math.random()*game.h})}
updateExplosions(){for(const e of this.explosions)e.update();this.explosions=this.explosions.filter(e=>e.alive)}
updateSmokes(){for(const s of this.smokes){s.y+=s.vy;s.life--}this.smokes=this.smokes.filter(s=>s.life>0)}
spawnEnemy(){let type="normal";if(this.wave>=2&&Math.random()<0.3)type="elite";const x=40+Math.random()*(this.game.w-80);this.enemies.push(new Enemy(type,x,-40))}
spawnBoss(){this.enemies.push(new Enemy("boss",this.game.w/2,-80))}
update(){const g=this.game;for(const s of this.stars){s.y+=2;if(s.y>g.h){s.y=-5;s.x=Math.random()*g.w}}for(const c of this.clouds){c.y+=0.5;if(c.y>g.h+20){c.y=-30;c.x=Math.random()*g.w}}
if(this.player.crashing){this.player.update(g.keys,g.touchX,g.touchY,g.touching,g.w,g.h);if(this.player.smokeTimer%5===0)this.smokes.push({x:this.player.px+rand(-10,10),y:this.player.py,life:40,vy:-1});if(this.player.py>g.h-80&&!this.crashExplosionDone){this.crashExplosionDone=true;this.explosions.push(new Explosion(this.player.px,g.h-60,5));this.player.visible=false}this.gameOverTimer++;if(this.gameOverTimer>120){this.finalScore=this.score;this.victory=false;this.complete=true}this.updateExplosions();this.updateSmokes();return}
this.player.update(g.keys,g.touchX,g.touchY,g.touching,g.w,g.h);
this.autoShootTimer++;const shouldShoot=g.keys.shoot||g.touching||this.autoShootTimer>8;if(shouldShoot&&this.player.canShoot()){this.playerBullets.push(this.player.shoot());this.autoShootTimer=0}
this.waveTimer++;if(!this.bossSpawned){if(this.enemiesSpawned<this.enemiesInWave&&this.waveTimer>60){this.waveTimer=0;this.spawnEnemy();this.enemiesSpawned++}let ae=0;for(const en of this.enemies)if(en.alive)ae++;if(this.enemiesSpawned>=this.enemiesInWave&&ae===0){this.wave++;if(this.wave>3){this.bossSpawned=true;this.spawnBoss()}else{this.enemiesSpawned=0;this.enemiesInWave=5+this.wave*2;this.waveTimer=-90}}}
for(const en of this.enemies){en.update(g.w,g.h);if(en.canShoot()){const bs=en.shoot();for(const b of bs)this.enemyBullets.push(b)}}
for(const b of this.playerBullets)b.update();for(const b of this.enemyBullets)b.update();
for(const b of this.playerBullets){if(!b.alive)continue;for(const en of this.enemies){if(!en.alive)continue;if(b.hitTest(en.px,en.py,en.w,en.h)){b.alive=false;if(en.takeDamage(b.damage)){this.score+=en.scoreValue;this.explosions.push(new Explosion(en.px,en.py,en.type==="boss"?5:3));en.alive=false;if(en.type==="boss")this.bossDefeated=true}break}}}
for(const b of this.enemyBullets){if(!b.alive)continue;if(b.hitTest(this.player.px,this.player.py,this.player.w*0.6,this.player.h*0.6)){b.alive=false;this.player.takeDamage(1)}}
for(const en of this.enemies){if(!en.alive)continue;if(Math.abs(en.px-this.player.px)<(en.w+this.player.w)*0.3&&Math.abs(en.py-this.player.py)<(en.h+this.player.h)*0.3){this.player.takeDamage(2);if(en.takeDamage(5)){this.score+=en.scoreValue;this.explosions.push(new Explosion(en.px,en.py,3))}}}
this.playerBullets=this.playerBullets.filter(b=>b.alive);this.enemyBullets=this.enemyBullets.filter(b=>b.alive);this.enemies=this.enemies.filter(en=>en.alive);
this.updateExplosions();this.updateSmokes();
if(this.bossDefeated){this.finalScore=this.score;this.victory=true;this.complete=true}}
draw(ctx){const g=this.game;ctx.fillStyle="#0A1628";ctx.fillRect(0,0,g.w,g.h);for(const s of this.stars)drawPixelArt(ctx,ART_STAR,s.x,s.y,1);ctx.globalAlpha=0.3;for(const c of this.clouds)drawPixelArt(ctx,ART_CLOUD,c.x,c.y,2);ctx.globalAlpha=1;
for(const s of this.smokes){ctx.globalAlpha=s.life/40*0.7;drawPixelArt(ctx,ART_SMOKE,s.x-7,s.y-7,2)}ctx.globalAlpha=1;
for(const en of this.enemies)en.draw(ctx);for(const b of this.playerBullets)b.draw(ctx);for(const b of this.enemyBullets)b.draw(ctx);this.player.draw(ctx);for(const e of this.explosions)e.draw(ctx);
drawText(ctx,"分数: "+this.score,10,10,16,"#FFFFFF",true);const wl=this.bossSpawned?"BOSS战!":"第"+this.wave+"波";drawText(ctx,wl,10,32,14,"#FFEB3B");
const hx=g.w-160,hy=15;ctx.fillStyle="#333333";ctx.fillRect(hx,hy,140,16);const pct=this.player.hp/this.player.maxHp;const hc=pct>0.5?"#4CAF50":(pct>0.25?"#FFC107":"#F44336");ctx.fillStyle=hc;ctx.fillRect(hx+2,hy+2,(140-4)*pct,12);ctx.strokeStyle="#FFFFFF";ctx.lineWidth=1;ctx.strokeRect(hx,hy,140,16);drawText(ctx,"HP",hx,hy-14,12,"#FFFFFF")}}
class VictoryScene{constructor(game,score){this.game=game;this.complete=false;this.score=score;this.state=0;this.stateTimer=0;this.textIndex=0;this.textTimer=0;this.fullText="感谢你的付出。";this.chief=new Character("chief",150,game.h-200,3);this.player=new Character("player",330,game.h-200,3);this.restart=false;this.stars=[];for(let i=0;i<40;i++)this.stars.push({x:Math.random()*game.w,y:Math.random()*game.h*0.6})}
handleClick(){if(this.state===0){if(this.textIndex<this.fullText.length)this.textIndex=this.fullText.length;else{this.state=1;this.stateTimer=0}}else if(this.state===1)this.restart=true}
update(){if(this.state===0){this.textTimer++;if(this.textTimer>=3&&this.textIndex<this.fullText.length){this.textTimer=0;this.textIndex++}this.chief.update();this.player.update()}this.stateTimer++}
draw(ctx){const g=this.game;ctx.fillStyle="#1A237E";ctx.fillRect(0,0,g.w,g.h);ctx.fillStyle="#283593";ctx.fillRect(0,g.h*0.3,g.w,g.h*0.7);ctx.fillStyle="#3949AB";ctx.fillRect(0,g.h*0.6,g.w,g.h*0.4);for(const s of this.stars){if(Math.random()>0.15)drawPixelArt(ctx,ART_STAR,s.x,s.y,1)}
ctx.globalAlpha=this.stateTimer%60<30?1:0.7;drawText(ctx,"胜 利",(g.w-measureText(ctx,"胜 利",36,true))/2,80,36,"#FFEB3B",true);ctx.globalAlpha=1;
if(this.state>=1)drawText(ctx,"最终分数: "+this.score,(g.w-measureText(ctx,"最终分数: "+this.score,20,true))/2,140,20,"#4FC3F7",true);
this.chief.draw(ctx);this.player.draw(ctx);
if(this.state===0){ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(30,g.h-160,g.w-60,100);ctx.strokeStyle="#FFEB3B";ctx.lineWidth=2;ctx.strokeRect(30,g.h-160,g.w-60,100);drawText(ctx,"局长",50,g.h-155,14,"#FFEB3B",true);ctx.save();ctx.font='16px "SimSun","宋体",monospace';ctx.fillStyle="#FFFFFF";ctx.textBaseline="top";ctx.fillText(this.fullText.substring(0,this.textIndex),50,g.h-130);ctx.restore()}
if(this.state>=1&&Math.floor(this.stateTimer/30)%2===0)drawText(ctx,"点击重新开始",(g.w-measureText(ctx,"点击重新开始",16))/2,g.h-40,16,"#AAAAAA")}}
class GameOverScene{constructor(game,score){this.game=game;this.complete=false;this.score=score;this.stateTimer=0;this.restart=false;this.debris=[];for(let i=0;i<8;i++)this.debris.push({x:Math.random()*game.w,y:game.h-100+Math.random()*60})}
handleClick(){this.stateTimer++;if(this.stateTimer>30)this.restart=true}
update(){this.stateTimer++}
draw(ctx){const g=this.game;ctx.fillStyle="#1A0A0A";ctx.fillRect(0,0,g.w,g.h);ctx.fillStyle="#2D1414";ctx.fillRect(0,g.h*0.5,g.w,g.h*0.5);ctx.fillStyle="#3E1F1F";ctx.fillRect(0,g.h-80,g.w,80);ctx.fillStyle="#000000";ctx.beginPath();ctx.ellipse(g.w/2,g.h-75,60,15,0,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=0.6;for(const d of this.debris)drawPixelArt(ctx,ART_EXPLOSION_3,d.x,d.y,2);ctx.globalAlpha=1;
ctx.globalAlpha=this.stateTimer%40<20?1:0.6;drawText(ctx,"游戏结束",(g.w-measureText(ctx,"游戏结束",40,true))/2,200,40,"#F44336",true);ctx.globalAlpha=1;
drawText(ctx,"分数: "+this.score,(g.w-measureText(ctx,"分数: "+this.score,20))/2,280,20,"#FFFFFF");drawText(ctx,"战机已坠毁",(g.w-measureText(ctx,"战机已坠毁",16))/2,330,16,"#AAAAAA");
if(this.stateTimer%60<30)drawText(ctx,"点击重新开始",(g.w-measureText(ctx,"点击重新开始",18))/2,g.h-100,18,"#4FC3F7")}}
class Game{constructor(){this.canvas=document.getElementById("gameCanvas");this.ctx=this.canvas.getContext("2d");this.ctx.imageSmoothingEnabled=false;this.w=480;this.h=800;this.keys={left:false,right:false,up:false,down:false,shoot:false};this.touchX=0;this.touchY=0;this.touching=false;this.scene=null;this.setupInput();this.resize();window.addEventListener("resize",()=>this.resize());this.startIntro();this.loop()}
resize(){const c=document.getElementById("gameContainer");const ratio=this.w/this.h;let cw=window.innerWidth,ch=window.innerHeight;if(cw/ch>ratio)cw=ch*ratio;else ch=cw/ratio;c.style.width=cw+"px";c.style.height=ch+"px"}
setupInput(){window.addEventListener("keydown",e=>{const c=e.keyCode;if(c===37||c===65)this.keys.left=true;if(c===39||c===68)this.keys.right=true;if(c===38||c===87)this.keys.up=true;if(c===40||c===83)this.keys.down=true;if(c===32){this.keys.shoot=true;e.preventDefault()}});
window.addEventListener("keyup",e=>{const c=e.keyCode;if(c===37||c===65)this.keys.left=false;if(c===39||c===68)this.keys.right=false;if(c===38||c===87)this.keys.up=false;if(c===40||c===83)this.keys.down=false;if(c===32)this.keys.shoot=false});
this.canvas.addEventListener("mousedown",e=>{this.touching=true;this.updateTouch(e);if(this.scene.handleClick)this.scene.handleClick()});
window.addEventListener("mouseup",()=>{this.touching=false});
this.canvas.addEventListener("mousemove",e=>{if(this.touching)this.updateTouch(e)});
this.canvas.addEventListener("touchstart",e=>{e.preventDefault();this.touching=true;this.updateTouch(e.touches[0]);if(this.scene.handleClick)this.scene.handleClick()},{passive:false});
this.canvas.addEventListener("touchend",e=>{e.preventDefault();this.touching=false},{passive:false});
this.canvas.addEventListener("touchmove",e=>{e.preventDefault();this.updateTouch(e.touches[0])},{passive:false})}
updateTouch(e){const r=this.canvas.getBoundingClientRect();this.touchX=(e.clientX-r.left)*(this.w/r.width);this.touchY=(e.clientY-r.top)*(this.h/r.height)}
startIntro(){this.scene=new IntroScene(this)}
startBattle(){this.scene=new BattleScene(this)}
startVictory(score){this.scene=new VictoryScene(this,score)}
startGameOver(score){this.scene=new GameOverScene(this,score)}
loop(){this.scene.update();this.ctx.clearRect(0,0,this.w,this.h);this.scene.draw(this.ctx);
if(this.scene.complete){if(this.scene instanceof IntroScene)this.startBattle();else if(this.scene instanceof BattleScene){if(this.scene.victory)this.startVictory(this.scene.finalScore);else this.startGameOver(this.scene.finalScore)}}
if(this.scene.restart)this.startIntro();
requestAnimationFrame(()=>this.loop())}}
window.onload=()=>{new Game()};
</script>
